<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4a1d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>Portal Admin SDS Bunayya Islamic School</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6ef; --surface:#ffffff; --surface2:#eaefe3; --bar:#0b4a1d; --bar-ink:#fff;
  --ink:#14210f; --muted:#5b6b52; --line:#d6dfcb; --gold:#ffc814; --gold-ink:#3b2d00; --green:#0b5e20;
  --shadow:0 1px 2px rgba(0,0,0,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050a06; --surface:#0d1710; --surface2:#16241a; --bar:#0a3317; --bar-ink:#fff;
    --ink:#eef4e8; --muted:#9bb093; --line:#203526; --gold:#ffc814; --gold-ink:#3b2d00; --green:#27b34a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#050a06; --surface:#0d1710; --surface2:#16241a; --bar:#0a3317; --bar-ink:#fff;
  --ink:#eef4e8; --muted:#9bb093; --line:#203526; --gold:#ffc814; --gold-ink:#3b2d00; --green:#27b34a; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:96px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:12px;padding:12px 16px}
.bar img{width:44px;height:44px;border-radius:50%;flex:none;background:#fff}
.bar .t{flex:1;min-width:0}
.bar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px;line-height:1.15}
.bar p{margin:2px 0 0;font-size:12.5px;opacity:.8}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);flex:none}
.iconbtn svg{width:22px;height:22px}

.dates{display:flex;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--surface2);color:var(--green);font-weight:600;font-size:13.5px;border-bottom:1px solid var(--line)}
.dates span:last-child{color:var(--muted);font-weight:500;text-align:right}

.ticker{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--surface);overflow:hidden}
.ticker b{flex:none;background:#a81d1d;color:#fff;font-size:13px;font-weight:700;padding:11px 14px;display:flex;align-items:center;gap:6px}
.ticker b svg{width:16px;height:16px}
.ticker .run{flex:1;overflow:hidden;display:flex;align-items:center}
.ticker .run span{white-space:nowrap;padding-left:100%;animation:run 26s linear infinite;font-size:14px}
@keyframes run{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker .run span{animation:none;padding-left:12px;white-space:normal}}

.search{margin:14px 16px 0;display:none}
.search.on{display:block}
.search input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font:inherit}

.hero{margin:14px 16px 0;border-radius:22px;background:linear-gradient(135deg,#0b5e20,#0a3317);color:#fff;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:var(--gold);opacity:.95}
.hero::before{content:"";position:absolute;right:-8px;top:-20px;width:150px;height:150px;border-radius:50%;background:#0a3317;z-index:1}
.hero h2{margin:0;font-size:22px;font-weight:800;line-height:1.2;max-width:75%;position:relative;z-index:2}
.hero p{margin:6px 0 0;font-size:13.5px;opacity:.85;max-width:72%;position:relative;z-index:2}
.hero .stat{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;position:relative;z-index:2}

.panel{margin:16px 16px 0;border:1.5px solid var(--green);border-radius:22px;background:var(--surface);padding:18px 14px 6px}
.panel>h3{margin:0 0 4px;text-align:center;color:var(--green);font-size:15px;font-weight:800;letter-spacing:.6px}
.panel>h3::after{content:"";display:block;width:44px;height:3px;border-radius:2px;background:var(--green);margin:8px auto 0}
.panel .sub{display:flex;align-items:center;justify-content:space-between;margin:0 4px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}

.grp{margin:20px 16px 0}
.grp h3{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.grp h3 small{font-weight:600;color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 2px 8px;border-radius:16px;min-width:0}
.tile:active{background:var(--surface2)}
.ico{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px var(--c1)}
.ico svg{width:30px;height:30px}
.tile .n{margin-top:8px;font-size:13px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.tile .d{font-size:11px;color:var(--muted);line-height:1.25;margin-top:2px}
.tile.empty .ico{filter:grayscale(1);opacity:.45}
.tile.empty .n{color:var(--muted)}
.star{position:absolute;top:0;right:4px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.star svg{width:14px;height:14px}
.star[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.star[aria-pressed="true"] svg{fill:currentColor}

.note{margin:18px 16px 0;padding:14px 16px;border-radius:16px;background:var(--surface2);font-size:13.5px;color:var(--muted)}
.note b{color:var(--ink)}
.note code{background:var(--surface);padding:1px 6px;border-radius:6px;font-size:12.5px}
.emptybox{margin:28px 16px;text-align:center;color:var(--muted)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.bottom svg{width:24px;height:24px}
nav.bottom button[aria-current="page"]{color:var(--gold-ink)}
nav.bottom button[aria-current="page"] span.pill{background:var(--gold)}
span.pill{padding:3px 18px;border-radius:999px;display:grid;place-items:center}
nav.bottom button[aria-current="page"]{color:var(--ink)}


.adm-note{margin:14px 16px 0}
.adm-g{margin:16px 16px 0;padding:14px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface)}
.adm-h{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.adm-i{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.adm-i .f{display:grid;gap:6px;min-width:0}
.fld{width:100%;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:14px;min-width:0}
.fld.b{font-weight:700}
.btn{height:42px;padding:0 14px;border-radius:12px;font-weight:700;font-size:14px;background:var(--surface2);color:var(--ink);flex:none}
.btn.red{color:#c62828}
.btn.pri{background:var(--green);color:#fff;width:100%;height:48px;font-size:15px}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.add{width:100%;margin-top:8px;border:1.5px dashed var(--line);background:none;color:var(--green)}
.adm-bar{margin:14px 16px 0}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px}
.secth{margin:24px 16px 6px;font-size:17px;font-weight:800}
.secth::after{content:"";display:block;width:54px;height:3px;border-radius:2px;background:var(--green);margin-top:8px}
.catrow{display:flex;align-items:center;gap:14px;width:calc(100% - 32px);margin:0 16px;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left;font-weight:600;font-size:15.5px}
.catrow .ci{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.catrow .ci svg{width:20px;height:20px}
.catrow .nm{flex:1;min-width:0}
.catrow .cn{color:var(--muted);font-size:13px;font-weight:600}
.catrow .ch{color:var(--gold);font-size:22px;line-height:1;font-weight:700}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:8px;border-radius:999px;background:rgba(127,127,127,.22);font-size:12px}
.chip[aria-pressed="true"] .cnt{background:rgba(255,255,255,.25)}
.card{display:flex;align-items:center;gap:8px;margin:0 16px 12px;border:1.5px solid var(--line);border-radius:20px;background:var(--surface);padding:12px}
.card .lnk{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.card:active{background:var(--surface2)}
.cico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none}
.cico svg{width:26px;height:26px}
.ctx{min-width:0;display:flex;flex-direction:column;gap:1px}
.cat{font-size:11.5px;font-weight:800;letter-spacing:.6px;color:var(--green);text-transform:uppercase;display:flex;align-items:center;gap:5px}
.cat svg{width:12px;height:12px;color:var(--gold)}
.ct{font-size:16px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.cd{font-size:12.5px;color:var(--muted);line-height:1.3}
.card.empty .cico{filter:grayscale(1);opacity:.45}
.card .star{position:static;flex:none;width:34px;height:34px}
.lead{margin:12px 16px 0;color:var(--muted);font-size:13.5px}

.sech{display:flex;align-items:center;justify-content:space-between;margin:26px 16px 0}
.sech h2{margin:0;font-size:18px;font-weight:800}
.sech button{color:var(--green);font-weight:700;font-size:13.5px;padding:6px 4px}
.sech+.chips,.sech+.ncards{margin-top:12px}
.ncards{display:grid;gap:12px;padding:0 16px}
.ncard{display:flex;gap:12px;border:1.5px solid var(--line);border-radius:20px;background:var(--surface);padding:12px;cursor:pointer;position:relative}
.ncard:active{background:var(--surface2)}
.nth{width:92px;height:92px;border-radius:14px;flex:none;position:relative;overflow:hidden;background:linear-gradient(145deg,#0b5e20,#0a3317);display:grid;place-items:center}
.nth .nlogo{width:46px;height:46px;border-radius:50%;opacity:.9}
.nth img.nimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nbody{min-width:0;flex:1;padding-right:26px}
.nbody .cat{margin-bottom:2px}
.nbody .nt{font-size:15.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nbody .nm{margin-top:6px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.nbody .nm svg{width:14px;height:14px}
.shr{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.shr svg{width:18px;height:18px}
.box{margin:16px 16px 0;border:1.5px solid var(--line);border-radius:22px;background:var(--surface);padding:18px 16px}
.box h3{margin:0 0 14px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.box h3 svg{width:22px;height:22px;color:var(--green)}
.arow{display:flex;gap:14px;align-items:flex-start;padding:10px 0}
.arow.past{opacity:.55}
.adate{width:56px;height:56px;border-radius:14px;background:var(--green);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.05}
.adate b{font-size:20px}.adate span{font-size:12px;font-weight:600}
.at{font-weight:700;font-size:15.5px;line-height:1.3}
.am{color:var(--muted);font-size:13px;margin-top:2px}
.ppdb{margin:16px 16px 0;border-radius:24px;padding:22px 20px;background:linear-gradient(135deg,#0b7a55,#0a4f3a);color:#fff}
.pill2{display:inline-flex;align-items:center;gap:6px;background:rgba(255,200,20,.25);color:#ffd95e;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800;letter-spacing:.4px}
.ppdb h3{margin:14px 0 8px;font-size:24px;font-weight:800;line-height:1.2}
.ppdb p{margin:0 0 16px;opacity:.9;font-size:14.5px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;font-weight:800;font-size:15px;background:#000;color:#7ee2a8;text-align:center;padding:0 14px}
.bigbtn[aria-disabled="true"]{opacity:.5}
.infaq{margin:16px 16px 0;border:1.5px solid #8a5a14;border-radius:24px;padding:20px 18px;background:rgba(217,154,0,.12)}
.infaq h3{margin:0 0 8px;font-size:19px;font-weight:800;color:#c27a1a;display:flex;align-items:center;gap:8px}
.infaq h3 svg{width:22px;height:22px}
.infaq>p{margin:0 0 14px;font-size:14px}
.rek{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.rek .bk{color:#c27a1a;font-weight:700;font-size:14.5px}
.rek .nr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0}
.rek .nr b{font-size:24px;letter-spacing:.5px;overflow-wrap:anywhere}
.rek .an{color:var(--muted);font-size:13px}
.copy{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13.5px;flex:none}
.copy svg{width:16px;height:16px}
.wabtn{background:#8a5a14;color:#fff}
.yt{margin:26px 16px 0}
.ytlab{display:inline-block;background:#7a1313;color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:8px}
.yt h2{margin:10px 0 6px;font-size:22px;font-weight:800;line-height:1.2}
.yt p{margin:0 0 14px;color:var(--muted);font-size:14px}
.ytbtn{display:inline-flex;align-items:center;gap:8px;background:#7a1313;color:#fff;font-weight:700;border-radius:999px;padding:12px 18px;font-size:14.5px}
.ytbtn svg{width:18px;height:18px}
.vids{display:grid;gap:14px;margin-top:16px}
.vid{display:block;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
.vth{position:relative;aspect-ratio:16/9;background:linear-gradient(145deg,#2b0a0a,#0b0b0b);display:grid;place-items:center}
.vth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vth .pl{position:relative;width:60px;height:60px;border-radius:50%;background:rgba(180,20,20,.92);display:grid;place-items:center;color:#fff}
.vth .pl svg{width:26px;height:26px;fill:#fff}
.vt{padding:14px 16px}
.vt .cat{color:#17a2b8;margin-bottom:2px;text-transform:none;letter-spacing:0;font-size:14px}
.vt b{font-size:15.5px;line-height:1.3;display:block}
.about{margin:26px 16px 0;background:var(--bar);color:#fff;border-radius:24px;padding:22px 18px}
.about .hd{display:flex;gap:14px;align-items:center}
.about .hd img{width:58px;height:58px;border-radius:50%;background:#fff;flex:none}
.about h2{margin:0;font-size:20px;font-weight:800;line-height:1.15}
.about .sb{color:#ffd95e;font-weight:700;font-size:12.5px;letter-spacing:.4px;margin-top:3px}
.about p{margin:14px 0 0;font-size:14.5px;opacity:.92}
.about h4{margin:22px 0 4px;font-size:17px;font-weight:800}
.about h4::after{content:"";display:block;width:54px;height:3px;border-radius:2px;background:#27b34a;margin-top:6px}
.crow{display:flex;gap:14px;align-items:flex-start;padding:10px 0;font-size:14.5px;color:#fff}
.crow svg{width:22px;height:22px;flex:none;color:#4ade80;margin-top:1px}
.crow .e{opacity:.6}
.wrow{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:15px;color:#fff;border-bottom:1px solid rgba(255,255,255,.12);overflow-wrap:anywhere}
.wrow i{font-style:normal;color:#ffd95e;font-weight:700}
.foot{margin:22px 16px 0;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;text-align:center}
.adm-t{margin:22px 16px 0;font-size:17px;font-weight:800}
.adm-i textarea.fld{height:84px;padding:10px 12px;resize:vertical}
.lockb{position:absolute;top:-4px;left:calc(50% - 40px);width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.lockb svg{width:12px;height:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chk input{width:20px;height:20px;accent-color:var(--green)}
.fab{position:fixed;z-index:25;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;padding:0;background:#fff;border:3px solid #fff;box-shadow:0 0 0 3px rgba(39,179,74,.35),0 8px 22px rgba(0,0,0,.35);animation:pulse 2.4s ease-out infinite}
.fab img{width:100%;height:100%;border-radius:50%;display:block}
.fab[hidden],.fabtip[hidden]{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,200,20,.7),0 8px 22px rgba(0,0,0,.35)}70%{box-shadow:0 0 0 16px rgba(255,200,20,0),0 8px 22px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 0 rgba(255,200,20,0),0 8px 22px rgba(0,0,0,.35)}}
@media (prefers-reduced-motion:reduce){.fab{animation:none}}
.fabtip{position:fixed;z-index:25;right:max(84px,calc((100vw - 560px)/2 + 84px));bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:13px;padding:8px 12px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fabtip::after{content:"";position:absolute;right:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:var(--gold);border-right:0}
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheetbg[hidden]{display:none}
.sheet{width:100%;max-width:560px;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.sheet .top{display:flex;align-items:center;gap:12px}
.sheet .top img{width:52px;height:52px;border-radius:14px}
.sheet h2{margin:0;font-size:18px;font-weight:800;line-height:1.2}
.sheet p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sheet ol{margin:16px 0 4px;padding-left:20px;font-size:14px}
.sheet li{margin:0 0 8px}
.sheet .row{display:grid;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <img src="logo.png" alt="Logo SDS Bunayya Islamic School">
    <div class="t">
      <h1>BUNAYYA</h1>

/* ============ KODE ============ */
const ICONS={

 home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.900 1-6.100L3.200 9.500l6.100-.9z"/>',

};
const svg=(k,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[k]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

let favs=[],view='home',cat='all',query='';
try{favs=JSON.parse(localStorage.getItem('bunayya-favs')||'[]')}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('bunayya-favs',JSON.stringify(favs))}catch(e){}};
const key=(g,i)=>g.id+':'+i.n;

function tile(g,i){
  const k=key(g,i), on=favs.includes(k), ok=!!i.u;
  return `<div class="tile ${ok?'':'empty'}">
    <a class="lnk" ${!ok?`href="#" data-empty="1"`:i.locked?`href="#" data-lock="${esc(i.u)}"`:`href="${esc(i.u)}" target="_blank" rel="noopener"`} style="display:flex;flex-direction:column;align-items:center;width:100%">
      <span class="ico" style="background:linear-gradient(145deg,${g.c[0]},${g.c[1]});--c1:${g.c[1]}">${svg(i.ico||g.ico)}</span>${i.locked&&ok?`<span class="lockb" aria-label="Terkunci">${svg('lock')}</span>`:''}
      <span class="n">${esc(i.n)}</span><span class="d">${ok?esc(i.d):'Belum diisi'}</span>
    </a>
    <button class="star" data-k="${esc(k)}" aria-pressed="${on}" aria-label="Favorit ${esc(i.n)}">${svg('star')}</button>
  </div>`;
}
function card(g,i){
  const k=key(g,i), on=favs.includes(k), ok=!!i.u;
  const href=!ok?`href="#" data-empty="1"`:i.locked?`href="#" data-lock="${esc(i.u)}"`:`href="${esc(i.u)}" target="_blank" rel="noopener"`;
  return `<div class="card ${ok?'':'empty'}"><a class="lnk" ${href}>
    <span class="cico" style="background:linear-gradient(145deg,${g.c[0]},${g.c[1]})">${svg(i.ico||g.ico)}</span>
    <span class="ctx"><span class="cat">${esc(g.name)}${i.locked&&ok?svg('lock'):''}</span><span class="ct">${esc(i.n)}</span><span class="cd">${ok?esc(i.d):'Belum diisi'}</span></span></a>
    <button class="star" data-k="${esc(k)}" aria-pressed="${on}" aria-label="Favorit ${esc(i.n)}">${svg('star')}</button></div>`;
}
const listGroups=()=>GROUPS.filter(g=>g.id!=='unggulan');
let ncat='all';
function pd(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
const fdate=s=>{const d=pd(s);return d?d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):''};
const MON=['JAN','FEB','MAR','APR','MEI','JUN','JUL','AGU','SEP','OKT','NOV','DES'];
const br=s=>esc(s).replace(/\n/g,'<br>');
const newsList=()=>NEWS.map((n,ix)=>[n,ix]).sort((a,b)=>String(b[0].date||'').localeCompare(String(a[0].date||'')));
function newsCard(n,ix){
  return `<article class="ncard" data-news="${ix}" role="button" tabindex="0"><div class="nth"><img class="nlogo" src="logo.png" alt="">${n.img?`<img class="nimg" src="${esc(n.img)}" alt="" loading="lazy" onerror="this.remove()">`:''}</div>
  <div class="nbody"><div class="cat">${esc(n.cat||'Berita')}</div><div class="nt">${esc(n.title)}</div><div class="nm">${svg('cal')}${esc(fdate(n.date))}</div></div>
  <button class="shr" data-share="${ix}" aria-label="Bagikan ${esc(n.title)}">${svg('share')}</button></article>`;
}
function agendaRows(list){
  const today=new Date();today.setHours(0,0,0,0);
  return list.map(a=>{const d=pd(a.date),past=d&&d<today;
    return `<div class="arow ${past?'past':''}"><div class="adate"><b>${d?d.getDate():'–'}</b><span>${d?MON[d.getMonth()]:''}</span></div><div><div class="at">${esc(a.title)}</div><div class="am">${esc([a.time,a.place].filter(Boolean).join(' • '))}</div></div></div>`}).join('');
}
const agendaSorted=()=>AGENDA.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
function agendaUpcoming(n){
  const today=new Date();today.setHours(0,0,0,0);const s=agendaSorted();
  const up=s.filter(a=>{const d=pd(a.date);return !d||d>=today});
  return (up.length?up:s.slice(-n)).slice(0,n);
}
function ytId(u){const m=/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/.exec(u||'');return m?m[1]:''}
function secBerita(limit){
  const l=newsList();
  if(!l.length) return `<div class="sech"><h2>Berita Sekolah</h2></div><div class="emptybox"><p>Belum ada berita. Tambahkan lewat menu Admin.</p></div>`;
  return `<div class="sech"><h2>Berita Sekolah</h2>${limit?`<button data-go="berita">Lihat semua ›</button>`:''}</div><div class="ncards">${l.slice(0,limit||99).map(([n,ix])=>newsCard(n,ix)).join('')}</div>`;
}
function secAgenda(limit){
  const l=limit?agendaUpcoming(limit):agendaSorted();
  return `<div class="box"><h3>${svg('cal')}Agenda Sekolah</h3>${l.length?agendaRows(l):`<p class="am" style="margin:0">Belum ada agenda. Tambahkan lewat menu Admin.</p>`}${limit&&AGENDA.length>limit?`<button class="catrow" style="width:100%;margin:8px 0 0;padding:10px 0;border:0;color:var(--green)" data-go="agenda">Lihat semua agenda ›</button>`:''}</div>`;
}
function secPpdb(){
  const ok=!!PPDB.url;
  return `<div class="ppdb"><span class="pill2">${svg('cap','width="16" height="16"')} ${esc(PPDB.label||'PENERIMAAN MURID BARU')}</span><h3>${esc(PPDB.title||'Pendaftaran Murid Baru')}</h3><p>${br(PPDB.text||'')}</p>
  <a class="bigbtn" ${ok?`href="${esc(PPDB.url)}" target="_blank" rel="noopener"`:'href="#" aria-disabled="true" data-empty="1"'}>Daftar / Info Lengkap →</a></div>`;
}
function secInfaq(){
  const wa=String(INFAQ.wa||'').replace(/\D/g,'');
  return `<div class="infaq"><h3>${svg('heart')}${esc(INFAQ.title||'Infaq & Donasi')}</h3><p>${br(INFAQ.text||'')}</p>
  <div class="rek"><div class="bk">${esc(INFAQ.bank||'Nama bank belum diisi')}</div><div class="nr"><b>${esc(INFAQ.number||'–')}</b>${INFAQ.number?`<button class="copy" data-copy="${esc(INFAQ.number)}">${svg('copy')}Salin</button>`:''}</div><div class="an">${INFAQ.holder?'a.n. '+esc(INFAQ.holder):'Atas nama belum diisi'}</div></div>
  <a class="bigbtn wabtn" ${wa?`href="https://wa.me/${wa}?text=${encodeURIComponent('Assalamualaikum, saya ingin konfirmasi infaq untuk '+(CONTACT.name||'SDS Bunayya Islamic School')+'.')}" target="_blank" rel="noopener"`:'href="#" aria-disabled="true" data-empty="1"'}>Konfirmasi Infaq via WhatsApp</a></div>`;
}
function secYt(){
  const vs=(YT.videos||[]).filter(v=>v.u);
  return `<div class="yt"><span class="ytlab">YOUTUBE</span><h2>${esc(YT.title||'Video & Dokumentasi Kegiatan')}</h2><p>${br(YT.text||'')}</p>
  ${YT.channel?`<a class="ytbtn" href="${esc(YT.channel)}" target="_blank" rel="noopener">${svg('play')} Kunjungi Channel YouTube ${svg('ext')}</a>`:''}
  <div class="vids">${vs.map(v=>{const id=ytId(v.u);return `<a class="vid" href="${esc(v.u)}" target="_blank" rel="noopener"><div class="vth">${id?`<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">`:''}<span class="pl">${svg('play')}</span></div><div class="vt"><div class="cat">${esc(v.label||'Video')}</div><b>${esc(v.title)}</b></div></a>`}).join('')}</div>
  ${!vs.length&&!YT.channel?`<p class="am">Belum ada video. Tambahkan lewat menu Admin.</p>`:''}</div>`;
}
function secAbout(){
  const c=CONTACT,r=[];
  if(c.address)r.push(`<a class="crow" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.address)}" target="_blank" rel="noopener">${svg('pin')}<span>${esc(c.address)}</span></a>`);else r.push(`<div class="crow e">${svg('pin')}<span>Alamat sekolah belum diisi</span></div>`);
  if(c.phone)r.push(`<a class="crow" href="tel:${esc(String(c.phone).replace(/[^\d+]/g,''))}">${svg('phone')}<span>${esc(c.phone)}</span></a>`);
  if(c.email)r.push(`<a class="crow" href="mailto:${esc(c.email)}">${svg('mail')}<span>${esc(c.email)}</span></a>`);
  const web=[['Website',c.web],['Facebook',c.facebook],['YouTube',YT.channel]].filter(x=>x[1]);
  return `<div class="about"><div class="hd"><img src="logo.png" alt=""><div><h2>${esc(c.name||'SDS Bunayya')}</h2><div class="sb">${esc(c.sub||'BUNAYYA ISLAMIC SCHOOL')}</div></div></div>
  ${c.about?`<p>${br(c.about)}</p>`:''}
  <h4>Alamat Sekolah</h4>${r.join('')}
  <h4>Alamat Web</h4>${web.length?web.map(([n,u])=>`<a class="wrow" href="${esc(u)}" target="_blank" rel="noopener"><i>›</i><span><b>${n}</b> · ${esc(u.replace(/^https?:\/\//,''))}</span></a>`).join(''):`<div class="crow e"><span>Alamat web belum diisi</span></div>`}</div>
  <div class="foot">© ${new Date().getFullYear()} ${esc(c.name||'SDS Bunayya Islamic School')}</div>`;
}
function render(){
  const m=document.getElementById('main'); let h='';
  const q=query.trim().toLowerCase();
  const match=(g,i)=>!q||(i.n+' '+i.d+' '+g.name).toLowerCase().includes(q);
  if(view==='admin'){ m.innerHTML=adminHTML(); return; }
  if(q){
    const list=[];GROUPS.forEach(g=>g.items.forEach(i=>{if(match(g,i))list.push([g,i])}));
    h=list.length?`<div class="secth">Hasil pencarian <span class="cnt">${list.length}</span></div><div style="margin-top:12px">${list.map(([g,i])=>card(g,i)).join('')}</div>`
      :`<div class="emptybox"><p><b>Link tidak ditemukan.</b><br>Coba kata kunci lain.</p></div>`;
  } else if(view==='berita'){
    const l=newsList(),cats=[...new Set(l.map(([n])=>n.cat||'Berita'))];
    h=`<div class="chips" role="group" aria-label="Filter berita"><button class="chip" data-ncat="all" aria-pressed="${ncat==='all'}">Semua<span class="cnt">${l.length}</span></button>${cats.map(c=>`<button class="chip" data-ncat="${esc(c)}" aria-pressed="${ncat===c}">${esc(c)}<span class="cnt">${l.filter(([n])=>(n.cat||'Berita')===c).length}</span></button>`).join('')}</div>
    <div class="ncards" style="margin-top:14px">${l.filter(([n])=>ncat==='all'||(n.cat||'Berita')===ncat).map(([n,ix])=>newsCard(n,ix)).join('')||'<div class="emptybox"><p>Belum ada berita.</p></div>'}</div>`;
  } else if(view==='agenda'){
    h=secAgenda(0);
  } else if(view==='kategori'){
    const gs=listGroups(), total=gs.reduce((a,g)=>a+g.items.length,0);
    h=`<div class="chips" role="group" aria-label="Filter kategori"><button class="chip" data-cat="all" aria-pressed="${cat==='all'}">Semua<span class="cnt">${total}</span></button>${gs.map(g=>`<button class="chip" data-cat="${g.id}" aria-pressed="${cat===g.id}">${esc(g.name)}<span class="cnt">${g.items.length}</span></button>`).join('')}</div><div style="margin-top:14px">`;
    let n=0;gs.forEach(g=>{if(cat!=='all'&&g.id!==cat)return;g.items.forEach(i=>{n++;h+=card(g,i)})});
    if(!n)h+=`<div class="emptybox"><p><b>Belum ada link di kategori ini.</b><br>Tambahkan lewat menu Admin.</p></div>`;
    h+='</div>';
  } else {
    const filled=GROUPS.reduce((a,g)=>a+g.items.filter(i=>i.u).length,0);
    h+=`<div class="hero"><h2>Semua pekerjaan admin, satu tempat</h2><p>Ketuk ikon untuk membuka layanan.</p><span class="stat">${filled} link aktif</span></div>`;
    const fg=GROUPS.find(g=>g.id==='unggulan');
    if(fg&&fg.items.length) h+=`<div class="panel"><h3>LINK UNGGULAN</h3><div class="grid" style="margin-top:14px">${fg.items.map(i=>tile(fg,i)).join('')}</div></div>`;
    const fl=[];GROUPS.forEach(g=>g.items.forEach(i=>{if(favs.includes(key(g,i)))fl.push([g,i])}));
    if(fl.length) h+=`<div class="panel"><h3>AKSES CEPAT</h3><div class="grid" style="margin-top:14px">${fl.slice(0,6).map(([g,i])=>tile(g,i)).join('')}</div></div>`;
    h+=secBerita(3)+secAgenda(3)+secPpdb()+secInfaq()+secYt()+secAbout();
  }
  m.innerHTML=h;
}

function renderNav(){
  const t=[['home','Beranda','home'],['admin','Admin','gear'],['berita','Berita','news'],['agenda','Agenda','cal'],['kategori','Link','grid']];
  document.getElementById('nav').innerHTML=t.map(([v,l,ic])=>`<button data-v="${v}" ${view===v?'aria-current="page"':''}><span class="pill">${svg(ic)}</span>${l}</button>`).join('');
}
function copyText(s){
  const done=()=>toast('Nomor rekening disalin');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(done,()=>toast('Gagal menyalin'));
  else{try{const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done()}catch(e){toast('Gagal menyalin')}}
}
function shareNews(ix){
  const n=NEWS[ix];if(!n)return;
  const url=n.u||location.href.split('#')[0];

function keepScroll(fn){const y=scrollY;fn();render();scrollTo(0,y)}
function adminAct(el){
  const a=el.dataset.act,gi=+el.dataset.g,ii=+el.dataset.i;
  if(a==='addi')keepScroll(()=>draft.groups[gi].items.push({n:'Link baru',d:'',u:''}));
  else if(a==='deli'){if(confirm('Hapus link ini?'))keepScroll(()=>draft.groups[gi].items.splice(ii,1))}
  else if(a==='delg'){if(confirm('Hapus kategori beserta semua link di dalamnya?'))keepScroll(()=>draft.groups.splice(gi,1))}
  else if(a==='addg')keepScroll(()=>{const n=draft.groups.length;draft.groups.push({id:'g'+Date.now(),name:'Kategori baru',c:PALETTE[n%PALETTE.length],ico:'file',items:[]})});
  else if(a==='addarr'){const path=el.dataset.arr.split('.');keepScroll(()=>{let o=draft;path.slice(0,-1).forEach(k=>o=o[k]);const k=path[path.length-1];o[k]=o[k]||[];
    const tpl={news:{cat:'Berita',title:'Judul berita',date:new Date().toISOString().slice(0,10),img:'',u:'',body:''},agenda:{date:new Date().toISOString().slice(0,10),title:'Kegiatan baru',time:'',place:''},videos:{title:'Judul video',label:'Video',u:''}}[k];o[k].push(JSON.parse(JSON.stringify(tpl)))})}
  else if(a==='delarr'){if(confirm('Hapus item ini?')){const path=el.dataset.arr.split('.');keepScroll(()=>{let o=draft;path.forEach(k=>o=o[k]);o.splice(+el.dataset.ix,1)})}}
  else if(a==='save')saveLocal();
  else if(a==='download')downloadData();
  else if(a==='reset'){if(confirm('Hapus perubahan di HP ini dan kembali ke data dari GitHub?')){try{localStorage.removeItem(LS_KEY)}catch(e){}location.reload()}}
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.p&&draft){const p=t.dataset.p.split('.');let o=draft;p.slice(0,-1).forEach(k=>{o=o[k]=o[k]||{}});o[p[p.length-1]]=t.value;return}
  const f=t.dataset&&t.dataset.f; if(!f||!draft)return;
  const g=draft.groups[+t.dataset.g],i=g&&g.items[+t.dataset.i];
  if(f==='info')draft.info=t.value;
  else if(f==='pin')draft.pin=t.value;
  else if(f==='gname')g.name=t.value;
  else if(f==='gico')g.ico=t.value;
  else if(f==='lockPass')draft.lockPass=t.value;
  else if(f==='apkUrl')draft.apkUrl=t.value;
  else if(i)i[f]=(f==='locked')?t.checked:t.value;
});
function normUrl(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;return u}
function cleanDraft(){
  const bad=[];
  draft.groups.forEach(g=>g.items.forEach(i=>{
    i.n=(i.n||'').trim()||'Tanpa nama';i.d=(i.d||'').trim();i.u=normUrl(i.u);i.locked=!!i.locked;
    if(i.u){try{const x=new URL(i.u);if(!x.hostname.includes('.'))bad.push(i.n)}catch(e){bad.push(i.n)}}
  }));
  (draft.news||[]).forEach(n=>{n.title=(n.title||'').trim()||'Tanpa judul';n.img=normUrl(n.img);n.u=normUrl(n.u)});
  (draft.agenda||[]).forEach(a=>{a.title=(a.title||'').trim()||'Kegiatan'});
  if(draft.ppdb)draft.ppdb.url=normUrl(draft.ppdb.url);
  if(draft.youtube){draft.youtube.channel=normUrl(draft.youtube.channel);(draft.youtube.videos||[]).forEach(v=>v.u=normUrl(v.u))}
  if(draft.contact){draft.contact.web=normUrl(draft.contact.web);draft.contact.facebook=normUrl(draft.contact.facebook)}
  if(draft.infaq)draft.infaq.wa=String(draft.infaq.wa||'').replace(/\D/g,'');
  draft.pin=String(draft.pin||'').trim()||'1234';
  draft.lockPass=String(draft.lockPass||'').trim()||'Bunayya@123';
  draft.apkUrl=normUrl(draft.apkUrl);
  if(bad.length){toast('Alamat tidak valid: '+bad[0]);return false}
  return true;
}
function saveLocal(){
  if(!cleanDraft())return;
  try{localStorage.setItem(LS_KEY,JSON.stringify({base:BASE.version,data:draft}));toast('Tersimpan di HP ini');setTimeout(()=>location.reload(),600)}
  catch(e){toast('Gagal menyimpan di HP ini')}
}
function downloadData(){
  if(!cleanDraft())return;
  const out=Object.assign({},draft,{version:String(Date.now())});
  const txt='// Data link Portal Admin SDS Bunayya Islamic School\nwindow.SITE_DATA = '+JSON.stringify(out,null,2)+';\n';
  const url=URL.createObjectURL(new Blob([txt],{type:'text/javascript'}));
  const a=document.createElement('a');a.href=url;a.download='data.js';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('data.js diunduh. Unggah ke GitHub.');
}
