<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4a1d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>Portal Admin SDS Bunayya Islamic School</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6ef; --surface:#ffffff; --surface2:#eaefe3; --bar:#0b4a1d; --bar-ink:#fff;
  --ink:#14210f; --muted:#5b6b52; --line:#d6dfcb; --gold:#ffc814; --gold-ink:#3b2d00; --green:#0b5e20;
  --shadow:0 1px 2px rgba(0,0,0,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050a06; --surface:#0d1710; --surface2:#16241a; --bar:#0a3317; --bar-ink:#fff;
    --ink:#eef4e8; --muted:#9bb093; --line:#203526; --gold:#ffc814; --gold-ink:#3b2d00; --green:#27b34a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#050a06; --surface:#0d1710; --surface2:#16241a; --bar:#0a3317; --bar-ink:#fff;
  --ink:#eef4e8; --muted:#9bb093; --line:#203526; --gold:#ffc814; --gold-ink:#3b2d00; --green:#27b34a; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:96px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:12px;padding:12px 16px}
.bar img{width:44px;height:44px;border-radius:50%;flex:none;background:#fff}
.bar .t{flex:1;min-width:0}
.bar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px;line-height:1.15}
.bar p{margin:2px 0 0;font-size:12.5px;opacity:.8}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);flex:none}
.iconbtn svg{width:22px;height:22px}

.dates{display:flex;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--surface2);color:var(--green);font-weight:600;font-size:13.5px;border-bottom:1px solid var(--line)}
.dates span:last-child{color:var(--muted);font-weight:500;text-align:right}

.ticker{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--surface);overflow:hidden}
.ticker b{flex:none;background:#a81d1d;color:#fff;font-size:13px;font-weight:700;padding:11px 14px;display:flex;align-items:center;gap:6px}
.ticker b svg{width:16px;height:16px}
.ticker .run{flex:1;overflow:hidden;display:flex;align-items:center}
.ticker .run span{white-space:nowrap;padding-left:100%;animation:run 26s linear infinite;font-size:14px}
@keyframes run{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker .run span{animation:none;padding-left:12px;white-space:normal}}

.search{margin:14px 16px 0;display:none}
.search.on{display:block}
.search input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font:inherit}

.hero{margin:14px 16px 0;border-radius:22px;background:linear-gradient(135deg,#0b5e20,#0a3317);color:#fff;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:var(--gold);opacity:.95}
.hero::before{content:"";position:absolute;right:-8px;top:-20px;width:150px;height:150px;border-radius:50%;background:#0a3317;z-index:1}
.hero h2{margin:0;font-size:22px;font-weight:800;line-height:1.2;max-width:75%;position:relative;z-index:2}
.hero p{margin:6px 0 0;font-size:13.5px;opacity:.85;max-width:72%;position:relative;z-index:2}
.hero .stat{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;position:relative;z-index:2}

.panel{margin:16px 16px 0;border:1.5px solid var(--green);border-radius:22px;background:var(--surface);padding:18px 14px 6px}
.panel>h3{margin:0 0 4px;text-align:center;color:var(--green);font-size:15px;font-weight:800;letter-spacing:.6px}
.panel>h3::after{content:"";display:block;width:44px;height:3px;border-radius:2px;background:var(--green);margin:8px auto 0}
.panel .sub{display:flex;align-items:center;justify-content:space-between;margin:0 4px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}

.grp{margin:20px 16px 0}
.grp h3{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.grp h3 small{font-weight:600;color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 2px 8px;border-radius:16px;min-width:0}
.tile:active{background:var(--surface2)}
.ico{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px var(--c1)}
.ico svg{width:30px;height:30px}
.tile .n{margin-top:8px;font-size:13px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.tile .d{font-size:11px;color:var(--muted);line-height:1.25;margin-top:2px}
.tile.empty .ico{filter:grayscale(1);opacity:.45}
.tile.empty .n{color:var(--muted)}
.star{position:absolute;top:0;right:4px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.star svg{width:14px;height:14px}
.star[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.star[aria-pressed="true"] svg{fill:currentColor}

.note{margin:18px 16px 0;padding:14px 16px;border-radius:16px;background:var(--surface2);font-size:13.5px;color:var(--muted)}
.note b{color:var(--ink)}
.note code{background:var(--surface);padding:1px 6px;border-radius:6px;font-size:12.5px}
.emptybox{margin:28px 16px;text-align:center;color:var(--muted)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.bottom svg{width:24px;height:24px}
nav.bottom button[aria-current="page"]{color:var(--gold-ink)}
nav.bottom button[aria-current="page"] span.pill{background:var(--gold)}
span.pill{padding:3px 18px;border-radius:999px;display:grid;place-items:center}
nav.bottom button[aria-current="page"]{color:var(--ink)}


.adm-note{margin:14px 16px 0}
.adm-g{margin:16px 16px 0;padding:14px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface)}
.adm-h{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.adm-i{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.adm-i .f{display:grid;gap:6px;min-width:0}
.fld{width:100%;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:14px;min-width:0}
.fld.b{font-weight:700}
.btn{height:42px;padding:0 14px;border-radius:12px;font-weight:700;font-size:14px;background:var(--surface2);color:var(--ink);flex:none}
.btn.red{color:#c62828}
.btn.pri{background:var(--green);color:#fff;width:100%;height:48px;font-size:15px}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.add{width:100%;margin-top:8px;border:1.5px dashed var(--line);background:none;color:var(--green)}
.adm-bar{margin:14px 16px 0}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px}
.lockb{position:absolute;top:-4px;left:calc(50% - 40px);width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.lockb svg{width:12px;height:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chk input{width:20px;height:20px;accent-color:var(--green)}
.fab{position:fixed;z-index:25;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;padding:0;background:#fff;border:3px solid #fff;box-shadow:0 0 0 3px rgba(39,179,74,.35),0 8px 22px rgba(0,0,0,.35);animation:pulse 2.4s ease-out infinite}
.fab img{width:100%;height:100%;border-radius:50%;display:block}
.fab[hidden],.fabtip[hidden]{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,200,20,.7),0 8px 22px rgba(0,0,0,.35)}70%{box-shadow:0 0 0 16px rgba(255,200,20,0),0 8px 22px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 0 rgba(255,200,20,0),0 8px 22px rgba(0,0,0,.35)}}
@media (prefers-reduced-motion:reduce){.fab{animation:none}}
.fabtip{position:fixed;z-index:25;right:max(84px,calc((100vw - 560px)/2 + 84px));bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:13px;padding:8px 12px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fabtip::after{content:"";position:absolute;right:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:var(--gold);border-right:0}
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheetbg[hidden]{display:none}
.sheet{width:100%;max-width:560px;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.sheet .top{display:flex;align-items:center;gap:12px}
.sheet .top img{width:52px;height:52px;border-radius:14px}
.sheet h2{margin:0;font-size:18px;font-weight:800;line-height:1.2}
.sheet p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sheet ol{margin:16px 0 4px;padding-left:20px;font-size:14px}
.sheet li{margin:0 0 8px}
.sheet .row{display:grid;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <img src="logo.png" alt="Logo SDS Bunayya Islamic School">
    <div class="t">
      <h1>BUNAYYA</h1>
      <p>Portal Link Admin Sekolah</p>
    </div>
    <button class="iconbtn" id="sbtn" aria-label="Cari link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="iconbtn" id="tbtn" aria-label="Ganti tema terang atau gelap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>

  <div class="dates"><span id="hijri">–</span><span id="masehi">–</span></div>

  <div class="ticker">
    <b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM16 8a5 5 0 0 1 0 8"/></svg>Info Admin</b>
    <div class="run"><span id="ticker"></span></div>
  </div>

  <div class="search" id="search"><input id="q" type="search" placeholder="Cari link, mis. Dapodik, BOS, rapor" aria-label="Cari link"></div>

  <main id="main"></main>
</div>

<nav class="bottom" aria-label="Menu utama"><div id="nav"></div></nav>
<button class="fab" id="fab" aria-label="Unduh aplikasi Admin Bunayya ke HP" hidden><img src="logo.png" alt=""></button>
<div class="fabtip" id="fabtip" hidden>Unduh aplikasi</div>
<div class="sheetbg" id="sheetbg" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
  <div class="top"><img src="logo.png" alt=""><div><h2 id="sheet-t">Unduh Aplikasi Admin Bunayya</h2><p>Pasang di HP agar terbuka seperti aplikasi biasa.</p></div></div>
  <div id="sheetbody"></div>
  <div class="row"><button class="btn" id="sheetclose">Tutup</button></div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script>
const BASE=window.SITE_DATA||{info:'',groups:[],version:'0',pin:'1234'};
const LS_KEY='bunayya-data-v1';
function loadData(){try{const o=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(o&&o.base===BASE.version&&o.data)return o.data}catch(e){}return BASE}
const DATA=loadData();
const INFO=DATA.info, GROUPS=DATA.groups;
const PIN=String(DATA.pin||BASE.pin||'1234');
const APKURL=String(DATA.apkUrl||BASE.apkUrl||'');
const LOCKPASS=String(DATA.lockPass||BASE.lockPass||'Bunayya@123');

/* ============ KODE ============ */
const ICONS={
 db:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M14.8 9c-.4-1-1.5-1.6-2.8-1.6-1.6 0-2.8.8-2.8 2s1.2 1.7 2.8 2 2.8.8 2.8 2-1.2 2-2.8 2c-1.3 0-2.4-.6-2.8-1.6M12 5.8v1.6M12 16.6v1.6"/>',
 cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.4c2.2.7 3.5 2.5 3.5 5.6"/>',
 file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 badge:'<rect x="4" y="3" width="16" height="18" rx="2.5"/><circle cx="12" cy="10" r="2.5"/><path d="M8 17c.6-2 2.2-3 4-3s3.4 1 4 3"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 3.8 5.7 3.8 9S14.600 18.300 12 21c-2.6-2.7-3.800-5.700-3.800-9S9.400 5.700 12 3z"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.100a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.100a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.100a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.100a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.900 1-6.100L3.200 9.500l6.100-.9z"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.500v.1"/>',
 grid:'<rect x="4" y="4" width="6.500" height="6.500" rx="1.500"/><rect x="13.500" y="4" width="6.500" height="6.500" rx="1.500"/><rect x="4" y="13.500" width="6.500" height="6.500" rx="1.500"/><rect x="13.500" y="13.500" width="6.500" height="6.500" rx="1.500"/>'
};
const svg=(k,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[k]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

let favs=[],view='home',cat='all',query='';
try{favs=JSON.parse(localStorage.getItem('bunayya-favs')||'[]')}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('bunayya-favs',JSON.stringify(favs))}catch(e){}};
const key=(g,i)=>g.id+':'+i.n;

function tile(g,i){
  const k=key(g,i), on=favs.includes(k), ok=!!i.u;
  return `<div class="tile ${ok?'':'empty'}">
    <a class="lnk" ${!ok?`href="#" data-empty="1"`:i.locked?`href="#" data-lock="${esc(i.u)}"`:`href="${esc(i.u)}" target="_blank" rel="noopener"`} style="display:flex;flex-direction:column;align-items:center;width:100%">
      <span class="ico" style="background:linear-gradient(145deg,${g.c[0]},${g.c[1]});--c1:${g.c[1]}">${svg(g.ico)}</span>${i.locked&&ok?`<span class="lockb" aria-label="Terkunci">${svg('lock')}</span>`:''}
      <span class="n">${esc(i.n)}</span><span class="d">${ok?esc(i.d):'Belum diisi'}</span>
    </a>
    <button class="star" data-k="${esc(k)}" aria-pressed="${on}" aria-label="Favorit ${esc(i.n)}">${svg('star')}</button>
  </div>`;
}
function group(g,items){
  if(!items.length) return '';
  return `<section class="grp"><h3>${esc(g.name)} <small>${items.length} link</small></h3><div class="grid">${items.map(i=>tile(g,i)).join('')}</div></section>`;
}
function render(){
  const m=document.getElementById('main'); let h='';
  const q=query.trim().toLowerCase();
  const match=(g,i)=>!q||(i.n+' '+i.d+' '+g.name).toLowerCase().includes(q);
  if(view==='admin'){ m.innerHTML=adminHTML(); return; }
  if(view==='info'){
    const total=GROUPS.reduce((a,g)=>a+g.items.length,0), filled=GROUPS.reduce((a,g)=>a+g.items.filter(i=>i.u).length,0);
    h=`<div class="hero"><h2>Tentang portal ini</h2><p>Kumpulan link kerja admin SDS Bunayya Islamic School.</p><span class="stat">${filled} dari ${total} link sudah terisi</span></div>
    <div class="note"><b>Cara mengisi link.</b> Buka menu <code>Admin</code> di bawah dan masukkan PIN. Isi link, lalu unduh data.js dan unggah ke GitHub agar semua orang melihatnya.<br><br><b>Pasang di HP.</b> Buka menu titik tiga di Chrome, pilih <code>Tambahkan ke layar utama</code>.<br><br><b>Favorit</b> tersimpan di browser HP ini saja.</div>`;
  } else if(view==='fav'){
    const list=[]; GROUPS.forEach(g=>g.items.forEach(i=>{if(favs.includes(key(g,i))&&match(g,i))list.push([g,i])}));
    h=list.length?`<section class="grp"><h3>Favorit Saya <small>${list.length} link</small></h3><div class="grid">${list.map(([g,i])=>tile(g,i)).join('')}</div></section>`
      :`<div class="emptybox"><p><b>Belum ada favorit.</b><br>Ketuk bintang pada link di Beranda untuk menyimpannya di sini.</p></div>`;
  } else {
    const filled=GROUPS.reduce((a,g)=>a+g.items.filter(i=>i.u).length,0);
    if(!q&&cat==='all'){
      h+=`<div class="hero"><h2>Semua pekerjaan admin, satu tempat</h2><p>Ketuk ikon untuk membuka layanan.</p><span class="stat">${filled} link aktif</span></div>`;
      const fg=GROUPS.find(g=>g.id==='unggulan');
      if(fg&&fg.items.length) h+=`<div class="panel"><h3>LINK UNGGULAN</h3><div class="grid" style="margin-top:14px">${fg.items.map(i=>tile(fg,i)).join('')}</div></div>`;
      const fl=[];GROUPS.forEach(g=>g.items.forEach(i=>{if(favs.includes(key(g,i)))fl.push([g,i])}));
      if(fl.length) h+=`<div class="panel"><h3>AKSES CEPAT</h3><div class="grid" style="margin-top:14px">${fl.slice(0,6).map(([g,i])=>tile(g,i)).join('')}</div></div>`;
    }
    h+=`<div class="chips" role="group" aria-label="Filter kategori"><button class="chip" data-cat="all" aria-pressed="${cat==='all'}">Semua</button>${GROUPS.map(g=>`<button class="chip" data-cat="${g.id}" aria-pressed="${cat===g.id}">${esc(g.name)}</button>`).join('')}</div>`;
    let any=false;
    GROUPS.forEach(g=>{ if(cat!=='all'&&g.id!==cat)return; if(g.id==='unggulan'&&cat==='all'&&!q)return; const it=g.items.filter(i=>match(g,i)); if(it.length){any=true;h+=group(g,it)} });
    if(!any) h+=`<div class="emptybox"><p><b>Link tidak ditemukan.</b><br>Coba kata kunci lain atau pilih kategori Semua.</p></div>`;
  }
  m.innerHTML=h;
}
function renderNav(){
  const t=[['home','Beranda','home'],['admin','Admin','gear'],['fav','Favorit','star'],['info','Info','info']];
  document.getElementById('nav').innerHTML=t.map(([v,l,ic])=>`<button data-v="${v}" ${view===v?'aria-current="page"':''}><span class="pill">${svg(ic)}</span>${l}</button>`).join('')+`<button data-v="cat" aria-label="Kategori"><span class="pill">${svg('grid')}</span>Kategori</button>`;
}
function askLock(url){
  let ok=false;try{ok=sessionStorage.getItem('bunayya-unlock')==='1'}catch(e){}
  if(!ok){
    const v=prompt('Link ini terkunci. Masukkan password:');
    if(v===null)return;
    if(v!==LOCKPASS){toast('Password salah');return}
    try{sessionStorage.setItem('bunayya-unlock','1')}catch(e){}
  }
  window.open(url,'_blank','noopener');
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

document.addEventListener('click',e=>{
  const ac=e.target.closest('[data-act]'); if(ac){adminAct(ac);return}
  const s=e.target.closest('.star'); if(s){const k=s.dataset.k;const i=favs.indexOf(k);if(i>-1){favs.splice(i,1);toast('Dihapus dari favorit')}else{favs.push(k);toast('Disimpan di favorit')}saveFavs();const y=scrollY;render();scrollTo(0,y);return}
  const lk=e.target.closest('a[data-lock]'); if(lk){e.preventDefault();askLock(lk.dataset.lock);return}
  const l=e.target.closest('a[data-empty]'); if(l){e.preventDefault();toast('Link ini belum diisi');return}
  const c=e.target.closest('.chip'); if(c){cat=c.dataset.cat;render();return}
  const n=e.target.closest('#nav button'); if(n){
    if(n.dataset.v==='cat'){view='home';cat=cat==='all'?GROUPS[0].id:'all';render();renderNav();scrollTo({top:0});return}
    if(n.dataset.v==='admin'){enterAdmin();scrollTo({top:0});return}
    view=n.dataset.v;cat='all';render();renderNav();scrollTo({top:0});
  }
});
document.getElementById('sbtn').onclick=()=>{const s=document.getElementById('search');s.classList.toggle('on');if(s.classList.contains('on'))document.getElementById('q').focus();else{query='';document.getElementById('q').value='';render()}};
document.getElementById('q').oninput=e=>{query=e.target.value;if(view!=='home'&&view!=='fav'){view='home';renderNav()}render()};
document.getElementById('tbtn').onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('bunayya-theme',r.dataset.theme)}catch(e){}
};
try{const t=localStorage.getItem('bunayya-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}


/* ============ ADMIN ============ */
const ICON_OPTS=[['star','Unggulan'],['db','Data'],['coin','Keuangan'],['cap','Pendidikan'],['users','Siswa'],['file','Dokumen'],['badge','Pegawai'],['globe','Web']];
const PALETTE=[["#8b5cf6","#6d28d9"],["#f59e0b","#b45309"],["#ec4899","#be185d"],["#10b981","#047857"],["#0ea5e9","#0369a1"],["#f43f5e","#be123c"],["#14b8a6","#0f766e"]];
let draft=null,adminState='locked';
async function enterAdmin(){
  view='admin';
  let ok=false;try{ok=sessionStorage.getItem('bunayya-admin')==='1'}catch(e){}
  if(!ok){
    const v=prompt('Masukkan PIN admin');
    if(v===null){view='home';render();renderNav();return}
    if(String(v).trim()!==PIN){toast('PIN salah');view='home';render();renderNav();return}
    try{sessionStorage.setItem('bunayya-admin','1')}catch(e){}
  }
  adminState='ok';
  draft=JSON.parse(JSON.stringify({info:INFO,groups:GROUPS,pin:PIN,lockPass:LOCKPASS,apkUrl:APKURL}));
  render();renderNav();
}
function adminHTML(){
  if(adminState!=='ok') return `<div class="emptybox"><p>Menu ini khusus admin.</p></div>`;
  const bar=`<div class="adm-bar"><button class="btn pri" data-act="save">Simpan di HP ini</button></div>`;
  let h=`<div class="note adm-note"><b>Mode admin.</b> Isi link lalu ketuk <b>Simpan di HP ini</b> untuk melihat hasilnya. Agar semua orang melihat perubahan, ketuk <b>Unduh data.js</b> di bagian bawah, lalu unggah file itu ke GitHub menggantikan data.js yang lama.</div>`+bar;
  h+=`<section class="adm-g"><label class="lbl" for="f-info">Teks pengumuman berjalan</label><input id="f-info" class="fld" data-f="info" value="${esc(draft.info)}"></section>`;
  draft.groups.forEach((g,gi)=>{
    h+=`<section class="adm-g"><div class="adm-h"><input class="fld b" data-f="gname" data-g="${gi}" value="${esc(g.name)}" aria-label="Nama kategori">
      <select class="fld" style="width:104px;flex:none" data-f="gico" data-g="${gi}" aria-label="Ikon kategori">${ICON_OPTS.map(([k,l])=>`<option value="${k}" ${g.ico===k?'selected':''}>${l}</option>`).join('')}</select>
      <button class="btn red" data-act="delg" data-g="${gi}" aria-label="Hapus kategori ${esc(g.name)}">Hapus</button></div>`;
    g.items.forEach((i,ii)=>{
      h+=`<div class="adm-i"><div class="f">
        <input class="fld b" data-f="n" data-g="${gi}" data-i="${ii}" value="${esc(i.n)}" placeholder="Nama link" aria-label="Nama link">
        <input class="fld" data-f="d" data-g="${gi}" data-i="${ii}" value="${esc(i.d)}" placeholder="Keterangan singkat" aria-label="Keterangan">
        <input class="fld" data-f="u" data-g="${gi}" data-i="${ii}" value="${esc(i.u)}" placeholder="https://alamat-link" inputmode="url" autocapitalize="none" aria-label="Alamat link">
        <label class="chk"><input type="checkbox" data-f="locked" data-g="${gi}" data-i="${ii}" ${i.locked?'checked':''}> Kunci dengan password</label></div>
        <button class="btn red" data-act="deli" data-g="${gi}" data-i="${ii}" aria-label="Hapus ${esc(i.n)}">Hapus</button></div>`;
    });
    h+=`<button class="btn add" data-act="addi" data-g="${gi}">+ Tambah link</button></section>`;
  });
  h+=`<div class="adm-bar"><button class="btn add" data-act="addg" style="margin-top:0">+ Tambah kategori</button></div>`;
  h+=`<section class="adm-g"><label class="lbl" for="f-apk">Link unduh file APK (boleh kosong)</label><input id="f-apk" class="fld" data-f="apkUrl" value="${esc(draft.apkUrl||'')}" placeholder="https://.../admin-bunayya.apk" inputmode="url" autocapitalize="none" style="margin-bottom:14px"><label class="lbl" for="f-lock">Password link terkunci (keuangan)</label><input id="f-lock" class="fld" data-f="lockPass" value="${esc(draft.lockPass)}" autocomplete="off" style="margin-bottom:14px"><label class="lbl" for="f-pin">PIN admin</label><input id="f-pin" class="fld" data-f="pin" value="${esc(draft.pin)}" inputmode="numeric" autocomplete="off"><p style="font-size:12.5px;color:var(--muted);margin:8px 0 0">PIN hanya pengaman ringan. Isinya terlihat di data.js, jadi jangan pakai PIN yang sama dengan akun penting.</p></section>`;
  h+=bar+`<div class="adm-bar"><button class="btn gold" style="width:100%;height:48px" data-act="download">Unduh data.js untuk GitHub</button></div>`;
  h+=`<div class="adm-bar"><button class="btn red" style="width:100%" data-act="reset">Kembalikan ke data GitHub</button></div>`;
  return h;
}
function keepScroll(fn){const y=scrollY;fn();render();scrollTo(0,y)}
function adminAct(el){
  const a=el.dataset.act,gi=+el.dataset.g,ii=+el.dataset.i;
  if(a==='addi')keepScroll(()=>draft.groups[gi].items.push({n:'Link baru',d:'',u:''}));
  else if(a==='deli'){if(confirm('Hapus link ini?'))keepScroll(()=>draft.groups[gi].items.splice(ii,1))}
  else if(a==='delg'){if(confirm('Hapus kategori beserta semua link di dalamnya?'))keepScroll(()=>draft.groups.splice(gi,1))}
  else if(a==='addg')keepScroll(()=>{const n=draft.groups.length;draft.groups.push({id:'g'+Date.now(),name:'Kategori baru',c:PALETTE[n%PALETTE.length],ico:'file',items:[]})});
  else if(a==='save')saveLocal();
  else if(a==='download')downloadData();
  else if(a==='reset'){if(confirm('Hapus perubahan di HP ini dan kembali ke data dari GitHub?')){try{localStorage.removeItem(LS_KEY)}catch(e){}location.reload()}}
}
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset&&t.dataset.f; if(!f||!draft)return;
  const g=draft.groups[+t.dataset.g],i=g&&g.items[+t.dataset.i];
  if(f==='info')draft.info=t.value;
  else if(f==='pin')draft.pin=t.value;
  else if(f==='gname')g.name=t.value;
  else if(f==='gico')g.ico=t.value;
  else if(f==='lockPass')draft.lockPass=t.value;
  else if(f==='apkUrl')draft.apkUrl=t.value;
  else if(i)i[f]=(f==='locked')?t.checked:t.value;
});
function normUrl(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;return u}
function cleanDraft(){
  const bad=[];
  draft.groups.forEach(g=>g.items.forEach(i=>{
    i.n=(i.n||'').trim()||'Tanpa nama';i.d=(i.d||'').trim();i.u=normUrl(i.u);i.locked=!!i.locked;
    if(i.u){try{const x=new URL(i.u);if(!x.hostname.includes('.'))bad.push(i.n)}catch(e){bad.push(i.n)}}
  }));
  draft.pin=String(draft.pin||'').trim()||'1234';
  draft.lockPass=String(draft.lockPass||'').trim()||'Bunayya@123';
  draft.apkUrl=normUrl(draft.apkUrl);
  if(bad.length){toast('Alamat tidak valid: '+bad[0]);return false}
  return true;
}
function saveLocal(){
  if(!cleanDraft())return;
  try{localStorage.setItem(LS_KEY,JSON.stringify({base:BASE.version,data:draft}));toast('Tersimpan di HP ini');setTimeout(()=>location.reload(),600)}
  catch(e){toast('Gagal menyimpan di HP ini')}
}
function downloadData(){
  if(!cleanDraft())return;
  const out=Object.assign({},draft,{version:String(Date.now())});
  const txt='// Data link Portal Admin SDS Bunayya Islamic School\nwindow.SITE_DATA = '+JSON.stringify(out,null,2)+';\n';
  const url=URL.createObjectURL(new Blob([txt],{type:'text/javascript'}));
  const a=document.createElement('a');a.href=url;a.download='data.js';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('data.js diunduh. Unggah ke GitHub.');
}

try{
  document.getElementById('hijri').textContent=new Intl.DateTimeFormat('id-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
}catch(e){document.getElementById('hijri').textContent='Portal Admin'}
document.getElementById('masehi').textContent=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'short',year:'numeric'}).format(new Date());
document.getElementById('ticker').textContent=INFO;
render();renderNav();

/* ============ PASANG APLIKASI ============ */
let deferredPrompt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const fab=document.getElementById('fab'),fabtip=document.getElementById('fabtip'),sheetbg=document.getElementById('sheetbg');
if(!standalone()){
  fab.hidden=false;
  try{if(!sessionStorage.getItem('bunayya-tip')){fabtip.hidden=false;setTimeout(()=>{fabtip.hidden=true},6000);sessionStorage.setItem('bunayya-tip','1')}}catch(e){}
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
window.addEventListener('appinstalled',()=>{fab.hidden=true;fabtip.hidden=true;toast('Aplikasi berhasil dipasang')});
function openSheet(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let h='';
  if(ios) h+=`<ol><li>Buka halaman ini di <b>Safari</b>.</li><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas).</li><li>Pilih <b>Tambah ke Layar Utama</b>, lalu ketuk <b>Tambah</b>.</li></ol>`;
  else h+=`<ol><li>Buka halaman ini di <b>Chrome</b>.</li><li>Ketuk menu <b>titik tiga</b> di pojok kanan atas.</li><li>Pilih <b>Pasang aplikasi</b> atau <b>Tambahkan ke layar utama</b>.</li><li>Ketuk <b>Pasang</b>. Ikon Bunayya muncul di layar utama.</li></ol>`;
  h+=`<div class="row">`;
  if(APKURL) h+=`<a class="btn pri" style="display:grid;place-items:center" href="${esc(APKURL)}" download>Unduh file APK</a>`;
  h+=`</div>`;
  document.getElementById('sheetbody').innerHTML=h;
  sheetbg.hidden=false;document.getElementById('sheetclose').focus();
}
function closeSheet(){sheetbg.hidden=true;fab.focus()}
fab.onclick=async()=>{
  fabtip.hidden=true;
  if(standalone()){toast('Aplikasi sudah terpasang');return}
  if(deferredPrompt){
    try{deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r&&r.outcome==='accepted')toast('Memasang aplikasi…');else openSheet()}
    catch(e){openSheet()}
  } else openSheet();
};
document.getElementById('sheetclose').onclick=closeSheet;
sheetbg.addEventListener('click',e=>{if(e.target===sheetbg)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheetbg.hidden)closeSheet()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
